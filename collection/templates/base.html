<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- bootstrap css CDN-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- custom css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utils.css') }}">

    {% block head %}

    {% endblock %}
</head>
<body>
    <div id="gameModal" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <p>content</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default w-100 m-0 p-0" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 10px;"></div>

    {% block content %}

    {% endblock %}

    <!--bootstrap library-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--socket io library-->
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>

    <script>
        function showToast(message, duration = 5000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-popup'
            toast.innerHTML = `
                <span class="toast-text">${message}</span>
                <button class="toast-close-btn">&times;</button>
            `;
            container.appendChild(toast);

            const dismissToast = () => {
                toast.classList.add('fade-out');
                // Wait for the CSS fadeOut animation to finish (500ms) before deleting from DOM
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            };
            toast.querySelector('.toast-close-btn').addEventListener('click', dismissToast);

            setTimeout(() => {
                if (toast.parentNode) {
                    dismissToast();
                }
            }, duration);
        }
    </script>

    {% block script %}

    {% endblock %}
</body>
</html>
