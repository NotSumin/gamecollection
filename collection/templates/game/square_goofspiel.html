{% block script %}
<script>
    const socket = io();
    const playerContainer = document.getElementById('player-container');
    const opponentContainer = document.getElementById('opponent-container');
    const playerCardQuantity = document.querySelectorAll('#player-container .card-quantity');
    const opponentCardQuantity = document.querySelectorAll('#opponent-container .card-quantity');
    const miscMessage = document.getElementById('misc-message');
    const gameLog = document.getElementById('game-log');
    const gameRound = document.getElementById('game-round');
    const cardButtons = document.querySelectorAll('#player-container .card-button');
    const playerScore = document.querySelector('#player-container .player-score');
    const opponentScore = document.querySelector('#opponent-container .player-score');
    let playerColor = '';
    let opponentColor = '';

    let redPlayer = {
        'card1': 6,
        'card2': 5,
        'card3': 4,
        'card4': 3,
        'card5': 2,
        'card6': 1,
        'column1': 0,
        'column2': 0,
        'column3': 0,
        'column4': 0,
        'column5': 0,
        'column6': 0,
        'row1': 0,
        'row2': 0,
        'row3': 0,
        'row4': 0,
        'row5': 0,
        'row6': 0,
        'wins': 0,
        'points': 0
    };
    let bluePlayer = {
        'card1': 6,
        'card2': 5,
        'card3': 4,
        'card4': 3,
        'card5': 2,
        'card6': 1,
        'column1': 0,
        'column2': 0,
        'column3': 0,
        'column4': 0,
        'column5': 0,
        'column6': 0,
        'row1': 0,
        'row2': 0,
        'row3': 0,
        'row4': 0,
        'row5': 0,
        'row6': 0,
        'wins': 0,
        'points': 0
    };

    function submitMove(move) {
        miscMessage.innerHTML = "Waiting for opponent...";
        cardButtons.forEach(cardButton => {
            cardButton.disabled = true;
        });
        socket.emit('move', move);
    }

    function updatePoints() {
        redPlayer['points'] = 0;
        bluePlayer['points'] = 0;
        for (let x = 0; x < 6; x++) {
            if (redPlayer[`column${1+x}`] > bluePlayer[`column${1+x}`]) redPlayer['points'] += (6-x);
            else if (redPlayer[`column${1+x}`] < bluePlayer[`column${1+x}`]) bluePlayer['points'] += (6-x);

            if (redPlayer[`row${1+x}`] > bluePlayer[`row${1+x}`]) redPlayer['points'] += (6-x);
            else if (redPlayer[`row${1+x}`] < bluePlayer[`row${1+x}`]) bluePlayer['points'] += (6-x);
        }

        playerScore.innerText = `👑${playerColor == 'red' ? redPlayer['points'] : bluePlayer['points']}`;
        opponentScore.innerText = `👑${opponentColor == 'red' ? redPlayer['points'] : bluePlayer['points']}`;
    }

    function updateGame(history) {
        let currentRound = 1;
        gameLog.innerHTML = '';
        gameLog.insertAdjacentHTML('beforeend', `<p>Game start</p>`);
        redPlayer = {
            'card1': 6,
            'card2': 5,
            'card3': 4,
            'card4': 3,
            'card5': 2,
            'card6': 1,
            'column1': 0,
            'column2': 0,
            'column3': 0,
            'column4': 0,
            'column5': 0,
            'column6': 0,
            'row1': 0,
            'row2': 0,
            'row3': 0,
            'row4': 0,
            'row5': 0,
            'row6': 0,
            'wins': 0,
            'points': 0
        };
        bluePlayer = {
            'card1': 6,
            'card2': 5,
            'card3': 4,
            'card4': 3,
            'card5': 2,
            'card6': 1,
            'column1': 0,
            'column2': 0,
            'column3': 0,
            'column4': 0,
            'column5': 0,
            'column6': 0,
            'row1': 0,
            'row2': 0,
            'row3': 0,
            'row4': 0,
            'row5': 0,
            'row6': 0,
            'wins': 0,
            'points': 0
        };
        let squares = [];
        for (let i = 0; i < history.length; i=i+2) {
            if (history[i] == 'x' || history[i+1] == 'x') {
                return;
            }

            miscMessage.innerHTML = '';

            // Display A-F for the round.
            if ((i >= 0 && i < 12) || (i >= 26 && i < 38) || (i >= 52 && i < 64) || (i >= 78 && i < 90) || (i >= 104 && i < 116) || (i >= 130 && i < 142)) {
                squares = [];

                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[0]['square']}`).innerText = "A";
                document.getElementById(`square-${squares[0]['square']}`).classList.add('color-yellow');

                gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound} squares have been assigned</p>`);
                gameLog.insertAdjacentHTML('beforeend', `<p>A: (${history[i]}, ${history[i+1]})</p>`);

                i+=2;
                
                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[1]['square']}`).innerText = "B";

                gameLog.insertAdjacentHTML('beforeend', `<p>B: (${history[i]}, ${history[i+1]})</p>`);
                i+=2;
                
                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[2]['square']}`).innerText = "C";

                gameLog.insertAdjacentHTML('beforeend', `<p>C: (${history[i]}, ${history[i+1]})</p>`);

                i+=2;
                
                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[3]['square']}`).innerText = "D";

                gameLog.insertAdjacentHTML('beforeend', `<p>D: (${history[i]}, ${history[i+1]})</p>`);

                i+=2;
                
                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[4]['square']}`).innerText = "E";

                gameLog.insertAdjacentHTML('beforeend', `<p>E: (${history[i]}, ${history[i+1]})</p>`);

                i+=2;
                
                squares.push({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[5]['square']}`).innerText = "F";

                gameLog.insertAdjacentHTML('beforeend', `<p>F: (${history[i]}, ${history[i+1]})</p>`);

                gameRound.innerText = `Round ${currentRound}A`;
            }

            // Process submissions
            if ((i >= 12 && i < 24) || (i >= 38 && i < 50) || (i >= 64 && i < 76) || (i >= 90 && i < 102) || (i >= 116 && i < 128) || (i >= 142 && i < 154)) {
                redPlayer[`card${history[i]}`] -= 1;
                bluePlayer[`card${history[i+1]}`] -= 1;

                let squaresIndex = 0;

                if (i % 26 == 12) {
                    gameRound.innerText = `Round ${currentRound}B`;
                    squaresIndex = 0;

                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}A (${squares[0]['column']}, ${squares[0]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    document.getElementById(`square-${squares[1]['square']}`).classList.add('color-yellow');
                }
                else if (i % 26 == 14) {
                    gameRound.innerText = `Round ${currentRound}C`;
                    squaresIndex = 1;

                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}B (${squares[1]['column']}, ${squares[1]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    document.getElementById(`square-${squares[2]['square']}`).classList.add('color-yellow');
                }
                else if (i % 26 == 16) {
                    gameRound.innerText = `Round ${currentRound}D`;
                    squaresIndex = 2;

                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}C (${squares[2]['column']}, ${squares[2]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    document.getElementById(`square-${squares[3]['square']}`).classList.add('color-yellow');
                }
                else if (i % 26 == 18) {
                    gameRound.innerText = `Round ${currentRound}E`;
                    squaresIndex = 3;

                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}D (${squares[3]['column']}, ${squares[3]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    document.getElementById(`square-${squares[4]['square']}`).classList.add('color-yellow');
                }
                else if (i % 26 == 20) {
                    gameRound.innerText = `Round ${currentRound}F`;
                    squaresIndex = 4;

                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}E (${squares[4]['column']}, ${squares[4]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    document.getElementById(`square-${squares[5]['square']}`).classList.add('color-yellow');
                }
                else if (i % 26 == 22) {
                    gameLog.insertAdjacentHTML('beforeend', `<p>Round ${currentRound}F (${squares[5]['column']}, ${squares[5]['row']})</p>`);
                    gameLog.insertAdjacentHTML('beforeend', `<p>Red played ${history[i]}, Blue played ${history[i+1]}</p>`);

                    currentRound += 1;
                    gameRound.innerText = `Proceed to Round ${currentRound}`;
                    miscMessage.innerHTML = `<button class="" onclick="submitMove('1')">Proceed</button>`;
                    squaresIndex = 5;
                }
                
                document.getElementById(`square-${squares[squaresIndex]['square']}`).innerText = '';
                document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                if (parseInt(history[i]) > parseInt(history[i+1])) {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.add('color-red');
                    redPlayer['wins'] += 1;
                    redPlayer[`column${squares[squaresIndex]['column']}`] += squares[squaresIndex]['row'];
                    redPlayer[`row${squares[squaresIndex]['row']}`] += squares[squaresIndex]['column'];
                }
                else if (parseInt(history[i]) < parseInt(history[i+1])) {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.add('color-blue');
                    bluePlayer['wins'] += 1;
                    bluePlayer[`column${squares[squaresIndex]['column']}`] += squares[squaresIndex]['row'];
                    bluePlayer[`row${squares[squaresIndex]['row']}`] += squares[squaresIndex]['column'];
                }
                else {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.add('color-gray');
                }
                
                let squareColumns = document.querySelectorAll(`.square-vertical-divider.column-${squares[squaresIndex]['column']}`);
                let squareRows = document.querySelectorAll(`.square-horizontal-divider.row-${squares[squaresIndex]['row']}`);

                if (redPlayer[`column${squares[squaresIndex]['column']}`] > bluePlayer[`column${squares[squaresIndex]['column']}`]) {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        column.classList.add('color-red-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.add('color-red');
                }
                else if (redPlayer[`column${squares[squaresIndex]['column']}`] < bluePlayer[`column${squares[squaresIndex]['column']}`]) {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        column.classList.add('color-blue-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.add('color-blue');
                }
                else {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        // column.classList.add('color-gray-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    // document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).classList.add('color-gray');
                }

                if (redPlayer[`row${squares[squaresIndex]['row']}`] > bluePlayer[`row${squares[squaresIndex]['row']}`]) {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        row.classList.add('color-red-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.add('color-red');
                }
                else if (redPlayer[`row${squares[squaresIndex]['row']}`] < bluePlayer[`row${squares[squaresIndex]['row']}`]) {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        row.classList.add('color-blue-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.add('color-blue');
                }
                else {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        // row.classList.add('color-gray-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.remove('color-yellow', 'color-red', 'color-blue', 'color-gray');
                    // document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).classList.add('color-gray');
                }

                updatePoints();

                if (i % 26 == 22) {
                    if (redPlayer['wins'] != 0) redPlayer[`card${redPlayer['wins']}`] += 1;
                    if (bluePlayer['wins'] != 0) bluePlayer[`card${bluePlayer['wins']}`] += 1;

                    if (redPlayer['wins'] != 0 && bluePlayer['wins'] != 0) gameLog.insertAdjacentHTML('beforeend', `<p>Red gains a ${redPlayer['wins']} card, Blue gains a ${bluePlayer['wins']} card</p>`);
                    else if (redPlayer['wins'] != 0 && bluePlayer['wins'] == 0) gameLog.insertAdjacentHTML('beforeend', `<p>Red gains a ${redPlayer['wins']} card</p>`);
                    else if (redPlayer['wins'] == 0 && bluePlayer['wins'] != 0) gameLog.insertAdjacentHTML('beforeend', `<p>Blue gains a ${bluePlayer['wins']} card</p>`);

                    redPlayer['wins'] = 0;
                    bluePlayer['wins'] = 0;
                }
            }

            // process proceed to next round prompt
            if (i % 26 == 24) {
                gameRound.innerText = `Round ${currentRound}A`;
            }

            document.querySelector('#player-card-0 button').disabled = i % 26 != 22 ? false : true;
            if (playerColor == 'red') {
                document.querySelector('#player-card-1 button').disabled = redPlayer['card1'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-2 button').disabled = redPlayer['card2'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-3 button').disabled = redPlayer['card3'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-4 button').disabled = redPlayer['card4'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-5 button').disabled = redPlayer['card5'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-6 button').disabled = redPlayer['card6'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-1 .card-quantity').innerText = redPlayer['card1'];
                document.querySelector('#player-card-2 .card-quantity').innerText = redPlayer['card2'];
                document.querySelector('#player-card-3 .card-quantity').innerText = redPlayer['card3'];
                document.querySelector('#player-card-4 .card-quantity').innerText = redPlayer['card4'];
                document.querySelector('#player-card-5 .card-quantity').innerText = redPlayer['card5'];
                document.querySelector('#player-card-6 .card-quantity').innerText = redPlayer['card6'];
                document.querySelector('#opponent-card-1 .card-quantity').innerText = bluePlayer['card1'];
                document.querySelector('#opponent-card-2 .card-quantity').innerText = bluePlayer['card2'];
                document.querySelector('#opponent-card-3 .card-quantity').innerText = bluePlayer['card3'];
                document.querySelector('#opponent-card-4 .card-quantity').innerText = bluePlayer['card4'];
                document.querySelector('#opponent-card-5 .card-quantity').innerText = bluePlayer['card5'];
                document.querySelector('#opponent-card-6 .card-quantity').innerText = bluePlayer['card6'];
            }
            else if (playerColor == 'blue') {
                document.querySelector('#player-card-1 button').disabled = bluePlayer['card1'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-2 button').disabled = bluePlayer['card2'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-3 button').disabled = bluePlayer['card3'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-4 button').disabled = bluePlayer['card4'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-5 button').disabled = bluePlayer['card5'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-6 button').disabled = bluePlayer['card6'] != 0 && i % 26 != 22 ? false : true;
                document.querySelector('#player-card-1 .card-quantity').innerText = bluePlayer['card1'];
                document.querySelector('#player-card-2 .card-quantity').innerText = bluePlayer['card2'];
                document.querySelector('#player-card-3 .card-quantity').innerText = bluePlayer['card3'];
                document.querySelector('#player-card-4 .card-quantity').innerText = bluePlayer['card4'];
                document.querySelector('#player-card-5 .card-quantity').innerText = bluePlayer['card5'];
                document.querySelector('#player-card-6 .card-quantity').innerText = bluePlayer['card6'];
                document.querySelector('#opponent-card-1 .card-quantity').innerText = redPlayer['card1'];
                document.querySelector('#opponent-card-2 .card-quantity').innerText = redPlayer['card2'];
                document.querySelector('#opponent-card-3 .card-quantity').innerText = redPlayer['card3'];
                document.querySelector('#opponent-card-4 .card-quantity').innerText = redPlayer['card4'];
                document.querySelector('#opponent-card-5 .card-quantity').innerText = redPlayer['card5'];
                document.querySelector('#opponent-card-6 .card-quantity').innerText = redPlayer['card6'];
            }

            let newP = document.querySelector('#game-log p:last-of-type');
            newP.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        let winner = '';
        if (redPlayer['points'] > bluePlayer['points']) {
            gameRound.innerText = `Game End - Red Player Wins`;
            gameLog.insertAdjacentHTML('beforeend', `<p>Game end - Red player wins (${redPlayer['points']}-${bluePlayer['points']})</p>`);
        }
        else if (redPlayer['points'] < bluePlayer['points']) {
            gameRound.innerText = `Game End - Blue Player Wins`;
            gameLog.insertAdjacentHTML('beforeend', `<p>Game end - Blue player wins (${bluePlayer['points']}-${redPlayer['points']})</p>`);
        }
        else {
            let redTiebreaker = redPlayer['card1'] + redPlayer['card2'] + redPlayer['card3'] + redPlayer['card4'] + redPlayer['card5'] + redPlayer['card6'];
            let blueTiebreaker = bluePlayer['card1'] + bluePlayer['card2'] + bluePlayer['card3'] + bluePlayer['card4'] + bluePlayer['card5'] + bluePlayer['card6'];
            if (redTiebreaker > blueTiebreaker) {
                gameRound.innerText = `Game End - Red Player Wins`;
                gameLog.insertAdjacentHTML('beforeend', `<p>Game end - Red player wins (${redPlayer['points']}-${bluePlayer['points']}, tiebreaker ${redTiebreaker}-${blueTiebreaker})</p>`);
            }
            else if (redTiebreaker < blueTiebreaker) {
                gameRound.innerText = `Game End - Blue Player Wins`;
                gameLog.insertAdjacentHTML('beforeend', `<p>Game end - Blue player wins (${bluePlayer['points']}-${redPlayer['points']}, tiebreaker ${blueTiebreaker}-${redTiebreaker})</p>`);
            }
            else {
                gameRound.innerText = `Game End - Tie`;
                gameLog.insertAdjacentHTML('beforeend', `<p>Game end - Tie (${redPlayer['points']}-${bluePlayer['points']}, tiebreaker ${redTiebreaker}-${blueTiebreaker})</p>`);
            }
        }

        let lastP = document.querySelector('#game-log p:last-of-type');
        lastP.scrollIntoView({ behavior: 'smooth', block: 'end' });

        document.querySelector('#player-card-0 button').disabled = true;
        document.querySelector('#player-card-1 button').disabled = true;
        document.querySelector('#player-card-2 button').disabled = true;
        document.querySelector('#player-card-3 button').disabled = true;
        document.querySelector('#player-card-4 button').disabled = true;
        document.querySelector('#player-card-5 button').disabled = true;
        document.querySelector('#player-card-6 button').disabled = true;

//     for character in history
//     if index = 0-11, 26-37, 52-63, 78-89, 104-115, 130-141: add A-F at respective squares
//     if index = 12-23, 38-49, 64-75, 90-101, 116-127, 142-153: processMove(red, blue)
//     processMove: updates card counts and board colors
    }

    socket.on('game_connection', (response) => {
        if (response.color) {
            playerColor = response.color;
            opponentColor = response.color == 'red' ? 'blue' : 'red';
            playerContainer.classList.remove('color-gray', 'color-red', 'color-blue');
            playerContainer.classList.add(`color-${playerColor}`);
            opponentContainer.classList.remove('color-gray', 'color-red', 'color-blue');
            opponentContainer.classList.add(`color-${opponentColor}`);
            playerCardQuantity.forEach(cardQuantity => {
                cardQuantity.classList.remove('color-gray-light', 'color-red-light', 'color-blue-light');
                cardQuantity.classList.add(`color-${playerColor}-light`);
            });
            opponentCardQuantity.forEach(cardQuantity => {
                cardQuantity.classList.remove('color-gray-light', 'color-red-light', 'color-blue-light');
                cardQuantity.classList.add(`color-${opponentColor}-light`);
            });
        }
        showToast(response.message);
        if (response.start) {
            updateGame(response.history);
        }
    });

    socket.on('game_connection_other', (response) => {
        const userId = {{ session.get('user_id') | tojson }};
        if (response.sender != userId) {
            showToast(response.message);
            if (response.start) {
                updateGame(response.history);
            }
        }
    });

    socket.on('game_update', (response) => {
        updateGame(response.history);
    });
</script>
