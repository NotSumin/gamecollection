<script>
    const socket = io();
    const playerContainer = document.getElementById('player-container');
    const opponentContainer = document.getElementById('opponent-container');
    const playerCardQuantity = document.querySelectorAll('#player-container .card-quantity');
    const opponentCardQuantity = document.querySelectorAll('#opponent-container .card-quantity');
    const miscMessage = document.getElementById('misc-message');
    const gameRound = document.getElementById('game-round');

    let redPlayer = {
        'card1': 6,
        'card2': 5,
        'card3': 4,
        'card4': 3,
        'card5': 2,
        'card6': 1,
        'column1': 0,
        'column2': 0,
        'column3': 0,
        'column4': 0,
        'column5': 0,
        'column6': 0,
        'row1': 0,
        'row2': 0,
        'row3': 0,
        'row4': 0,
        'row5': 0,
        'row6': 0,
        'wins': 0,
        'points': 0
    };
    let bluePlayer = {
        'card1': 6,
        'card2': 5,
        'card3': 4,
        'card4': 3,
        'card5': 2,
        'card6': 1,
        'column1': 0,
        'column2': 0,
        'column3': 0,
        'column4': 0,
        'column5': 0,
        'column6': 0,
        'row1': 0,
        'row2': 0,
        'row3': 0,
        'row4': 0,
        'row5': 0,
        'row6': 0,
        'wins': 0,
        'points': 0
    };

    function proceedToNext() {

    }

    function updatePoints() {
        for (let x = 0; x < 6; x++) {
            if (redPlayer[`column${1+x}`] > bluePlayer[`column${1+x}`]) redPlayer['points'] += (6-x);
            else if (redPlayer[`column${1+x}`] < bluePlayer[`column${1+x}`]) bluePlayer['points'] += (6-x);

            if (redPlayer[`row${1+x}`] > bluePlayer[`row${1+x}`]) redPlayer['points'] += (6-x);
            else if (redPlayer[`row${1+x}`] < bluePlayer[`row${1+x}`]) bluePlayer['points'] += (6-x);
        }
    }

    function updateGame(history, color) {
        let playerColor = color;
        let opponentColor = color == 'red' ? 'blue' : 'red';
        let currentRound = 1;
        redPlayer = {
            'card1': 6,
            'card2': 5,
            'card3': 4,
            'card4': 3,
            'card5': 2,
            'card6': 1,
            'column1': 0,
            'column2': 0,
            'column3': 0,
            'column4': 0,
            'column5': 0,
            'column6': 0,
            'row1': 0,
            'row2': 0,
            'row3': 0,
            'row4': 0,
            'row5': 0,
            'row6': 0,
            'wins': 0,
            'points': 0
        };
        bluePlayer = {
            'card1': 6,
            'card2': 5,
            'card3': 4,
            'card4': 3,
            'card5': 2,
            'card6': 1,
            'column1': 0,
            'column2': 0,
            'column3': 0,
            'column4': 0,
            'column5': 0,
            'column6': 0,
            'row1': 0,
            'row2': 0,
            'row3': 0,
            'row4': 0,
            'row5': 0,
            'row6': 0,
            'wins': 0,
            'points': 0
        };
        let squares = [];
        for (let i = 0; i < history.length; i=i+2) {
            if (history[i] == 'x' || history[i+1] == 'x') {
                return;
            }

            miscMessage.innerText = '';

            // Display A-F for the round.
            if ((i >= 0 && i < 12) || (i >= 26 && i < 38) || (i >= 52 && i < 64) || (i >= 78 && i < 90) || (i >= 104 && i < 116) || (i >= 130 && i < 142)) {
                squares = [];

                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[0]['square']}`).innerText = "A";

                i+=2;
                
                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[1]['square']}`).innerText = "B";

                i+=2;
                
                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[2]['square']}`).innerText = "C";

                i+=2;
                
                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[3]['square']}`).innerText = "D";

                i+=2;
                
                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[4]['square']}`).innerText = "E";

                i+=2;
                
                squares.append({
                    'column': history[i],
                    'row': history[i+1],
                    'square': parseInt(history[i]) + ((parseInt(history[i+1])-1) * 6)
                });
                document.getElementById(`square-${squares[5]['square']}`).innerText = "F";

                gameRound.innerText = `Round ${currentRound}A`;
            }

            // Process submissions
            if ((i >= 12 && i < 24) || (i >= 38 && i < 50) || (i >= 64 && i < 76) || (i >= 90 && i < 102) || (i >= 116 && i < 128) || (i >= 142 && i < 154)) {
                redPlayer[`card${history[i]}`] -= 1;
                bluePlayer[`card${history[i+1]}`] -= 1;
                
                // disable buttons accordingly later

                let squaresIndex = 0;

                if (i % 26 == 12) {
                    gameRound.innerText = `Round ${currentRound}B`;
                    squaresIndex = 0;
                    
                }
                else if (i % 26 == 14) {
                    gameRound.innerText = `Round ${currentRound}C`;
                    squaresIndex = 1;
                }
                else if (i % 26 == 16) {
                    gameRound.innerText = `Round ${currentRound}D`;
                    squaresIndex = 2;
                }
                else if (i % 26 == 18) {
                    gameRound.innerText = `Round ${currentRound}E`;
                    squaresIndex = 3;
                }
                else if (i % 26 == 20) {
                    gameRound.innerText = `Round ${currentRound}F`;
                    squaresIndex = 4;
                }
                else if (i % 26 == 22) {
                    currentRound += 1;
                    gameRound.innerText = `Proceed to Round ${currentRound}`;
                    miscMessage.innerHTML = `<button class="" onclick="proceedToNext">Proceed</button>`;
                    squaresIndex = 5;
                }
                
                document.getElementById(`square-${squares[squaresIndex]['square']}`).innerText = '';
                document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.remove('color-red', 'color-blue', 'color-gray');
                if (parseInt(history[i]) > parseInt(history[i+1])) {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.append('color-red');
                    redPlayer['wins'] += 1;
                    redPlayer[`column${squares[squaresIndex]['column']}`] += squares[squaresIndex]['row'];
                    redPlayer[`row${squares[squaresIndex]['row']}`] += squares[squaresIndex]['column'];
                }
                else if (parseInt(history[i]) < parseInt(history[i+1])) {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.append('color-blue');
                    bluePlayer['wins'] += 1;
                    bluePlayer[`column${squares[squaresIndex]['column']}`] += squares[squaresIndex]['row'];
                    bluePlayer[`row${squares[squaresIndex]['row']}`] += squares[squaresIndex]['column'];
                }
                else {
                    document.getElementById(`square-${squares[squaresIndex]['square']}`).classList.append('color-gray');
                }
                    
                
                let squareColumns = document.querySelectorAll(`.square-vertical-divider.column-${squares[squaresIndex]['column']}`);
                let squareRows = document.querySelectorAll(`.square-horizontal-divider.row-${squares[squaresIndex]['row']}`);

                if (redPlayer[`column${squares[squaresIndex]['column']}`] > bluePlayer[`column${squares[squaresIndex]['column']}`]) {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        column.classList.append('color-red-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).append('color-red');
                }
                else if (redPlayer[`column${squares[squaresIndex]['column']}`] < bluePlayer[`column${squares[squaresIndex]['column']}`]) {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        column.classList.append('color-blue-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).append('color-blue');
                }
                else {
                    squareColumns.forEach(column => {
                        column.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        column.classList.append('color-gray-light');
                    });
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.column-${squares[squaresIndex]['column']}`).append('color-gray');
                }

                if (redPlayer[`row${squares[squaresIndex]['row']}`] > bluePlayer[`row${squares[squaresIndex]['row']}`]) {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        row.classList.append('color-red-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).append('color-red');
                }
                else if (redPlayer[`row${squares[squaresIndex]['row']}`] > bluePlayer[`row${squares[squaresIndex]['row']}`]) {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        row.classList.append('color-blue-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).append('color-blue');
                }
                else {
                    squareRows.forEach(row => {
                        row.classList.remove('color-red-light', 'color-blue-light', 'color-gray-light');
                        row.classList.append('color-gray-light');
                    });
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).remove('color-red', 'color-blue', 'color-gray');
                    document.querySelector(`.square-points.row-${squares[squaresIndex]['row']}`).append('color-gray');
                }

                updatePoints();

                if (i % 26 == 22) {
                    redPlayer[`card${redPlayer['wins']}`] += 1;
                    bluePlayer[`card${bluePlayer['wins']}`] += 1;

                    redPlayer['wins'] = 0;
                    bluePlayer['wins'] = 0;
                }
            }

            // process proceed to next round prompt
            if (i % 26 == 24) {
                gameRound.innerText = `Round ${currentRound}A`;
            }
        }


//     for character in history
//     if index = 0-11, 26-37, 52-63, 78-89, 104-115, 130-141: add A-F at respective squares
//     if index = 12-23, 38-49, 64-75, 90-101, 116-127, 142-153: processMove(red, blue)
//     processMove: updates card counts and board colors
    }

    socket.on('game_connection', (response) => {
        if (response.color) {
            let playerColor = response.color;
            let opponentColor = response.color == 'red' ? 'blue' : 'red';
            playerContainer.classList.remove('color-gray')
            playerContainer.classList.add(`color-${playerColor}`)
            opponentContainer.classList.remove('color-gray')
            opponentContainer.classList.add(`color-${opponentColor}`)
            playerCardQuantity.forEach(cardQuantity => {
                cardQuantity.classList.add(`color-${playerColor}-light`);
            });
            opponentCardQuantity.forEach(cardQuantity => {
                cardQuantity.classList.add(`color-${opponentColor}-light`);
            });
        }
        showToast(response.message);
    });

    socket.on('self_update', (response) => {
        miscMessage.innerText = response.message;
    });

    socket.on('game_update', (response) => {
        // update game log
        // update board
        // update cards
    });
</script>
